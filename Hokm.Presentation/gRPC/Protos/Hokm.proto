syntax = "proto3";
package hokm;

service HokmGameService {
    rpc StartGame (StartGameRequest) returns (StartGameResponse);
    rpc LeaveLobby (LeaveLobbyRequest) returns (LeaveLobbyResponse);
    
    rpc FormTeams (FormTeamsRequest) returns (FormTeamsResponse);
    rpc DealCards (DealCardsRequest) returns (DealCardsResponse);
    rpc PickTrump (PickTrumpRequest) returns (PickTrumpResponse);
    rpc PlayCard (PlayCardRequest) returns (PlayCardResponse);
    rpc GetGameState (GetGameStateRequest) returns (GameState);
    rpc GetSnapshot (GetSnapshotRequest) returns (GameSnapshotResponse);
    rpc SendInGameAction(InGameActionRequest) returns (InGameActionResponse);
    rpc ReadyToPlay (ReadyToPlayRequest) returns (ReadyToPlayResponse);
    rpc GetTableConfigs (GetTableConfigsRequest) returns (GetTableConfigsResponse);
    rpc GetLeaderboard (GetLeaderboardRequest) returns (GetLeaderboardResponse);

    rpc ResumeControl (ResumeControlRequest) returns (ResumeControlResponse);
    rpc GetTrickDetails (GetTrickDetailsRequest) returns (GetTrickDetailsResponse);
    rpc GetPlayerProfile(GetPlayerProfileRequest) returns (GetPlayerProfileResponse);
    rpc StreamGame (StreamRequest) returns (stream GameEvent);
    rpc StreamLobby(StreamRequest) returns (stream GameEvent); 
}

service UserService {
    rpc GetProfile (GetProfileRequest) returns (UserProfileResponse);
    rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileResponse);
    rpc EquipProduct (EquipProductRequest) returns (EquipProductResponse);
}

service ShopService {
    rpc GetProducts (GetProductsRequest) returns (GetProductsResponse);
    rpc PurchaseWithCoins (PurchaseWithCoinsRequest) returns (PurchaseWithCoinsResponse);
    rpc InitiatePayment (InitiatePaymentRequest) returns (InitiatePaymentResponse);
    rpc VerifyStorePurchase (VerifyStorePurchaseRequest) returns (VerifyStorePurchaseResponse);

}


enum TableKind {
    BOT = 0;
    SPEEDY = 1;
    PRO = 2;
    VIP = 3;
}

enum ProductType {
    INVALID_PRODUCT = 0;
    COIN_BUNDLE = 1;
    VIP_SUBSCRIPTION = 2;
    CARD_THEME = 3;
    TABLE_THEME = 4;
    AVATAR = 5;
    AVATAR_BORDER = 6;
    EMOTE = 7;
    STICKER = 8;
    EMOJI = 9;
    VOICE_LINE = 10;
    QUICK_CHAT = 11;
    GIFT = 12;
    XP_BOOSTER = 13;
}

enum PaymentType {
    INVALID_PAYMENT = 0;
    FREE = 1;
    COINS = 2;
    DIRECT_PAYMENT = 3;
    ADS = 4;
    MARKET_IAP = 5;
}

enum GatewayType {
    NONE = 0;
    ZARINPAL = 1;
    CAFE_BAZAAR = 2;
    MYKET = 3;
}


message StartGameRequest {
  string player_id = 1;
  string player_name = 2;
  TableKind table_kind = 3; 
  int32 rounds = 4;
}

message StartGameResponse {
  string game_id = 1;
}

message LeaveLobbyRequest {
  string lobby_id = 1;
  string player_id = 2;
}

message LeaveLobbyResponse {
  bool success = 1;
}

message FormTeamsRequest {
  string game_id = 1;
}

message FormTeamsResponse {
  string game_id = 1;
}

message DealCardsRequest {
  string game_id = 1;
  string dealer_id = 2;
}

message DealCardsResponse {
  bool success = 1;
}

message PickTrumpRequest {
  string game_id = 1;
  string trump_suit = 2;
  string dealer_id = 3;
}

message PickTrumpResponse {
  bool success = 1;
}

message PlayCardRequest {
  string game_id = 1;
  string player_id = 2;
  string suit = 3;
  string rank = 4;
}

message PlayCardResponse {
  bool success = 1;
}

message GetGameStateRequest {
  string game_id = 1;
}

message GetSnapshotRequest {
  string game_id = 1;
  string player_id = 2;
}

message GameSnapshotResponse {
  string payload = 1;
}

message GameState {
  string game_id = 1;
  string status = 2;
  int32 current_round = 3;
}

message StreamRequest {
  string game_id = 1;
  string player_id = 2;
}

message GameEvent {
  string event_type = 1;
  string payload = 2;
}

message InGameActionRequest {
  string game_id = 1;
  string player_id = 2;
  string item_id = 3;
}

message InGameActionResponse {
  bool success = 1;
}

message ResumeControlRequest {
  string game_id = 1;
  string player_id = 2;
}

message ResumeControlResponse {
  bool success = 1;
}

message ReadyToPlayRequest {
  string game_id = 1;
  string player_id = 2;
}

message ReadyToPlayResponse {
  bool success = 1;
}


message GetProfileRequest {
    string user_id = 1;
}

message UserProfileResponse {
    string user_id = 1;
    string full_name = 2;
    string user_name = 3;
    string email = 4;
    int64 coin = 5;
    int32 level = 6;
    int32 score = 7;
    int32 wins = 8;
    int32 loses = 9;
    bool is_vip = 10;
    string vip_expire_date = 11; 
    bool has_changed_name = 12;
    repeated string owned_product_ids = 13;
    string active_card_theme_id = 14;
    string active_table_theme_id = 15;
    string active_avatar_border_id = 16;
}

message TrickCardMessage {
  string suit = 1;
  string rank = 2;
  string player_id = 3;
}

message GetTrickDetailsRequest {
  string game_id = 1;
  string player_id = 2;
  int32 trick_index = 3;
  string team_id = 4; 
}

message GetTrickDetailsResponse {
  bool success = 1;
  repeated TrickCardMessage cards = 2;
}


message UpdateProfileRequest {
    string user_id = 1;
    string full_name = 2;
    string user_name = 3;
    int32 avatar_ref = 4;    
}

message UpdateProfileResponse {
    bool status = 1;
}

message EquipProductRequest {
    string user_id = 1;
    string product_id = 2;
    ProductType product_type = 3;
}

message EquipProductResponse {
    bool success = 1;
    string message = 2;
}

message ProductItemMessage {
    string id = 1;
    string content = 2;
    string linked_product_id = 3;
    int32 quantity = 4;
    int32 sort_order = 5;
}

message ProductMessage {
    string id = 1;
    string title = 2;
    string description = 3;
    string asset_key = 4;
    ProductType product_type = 5;
    PaymentType payment_type = 6;
    int64 price = 7;
    int32 coin_amount = 8;
    int32 vip_duration_days = 9;
    bool is_free = 10;
    repeated ProductItemMessage items = 11;
    string market_sku = 12; 
}

message GetProductsRequest {
    optional ProductType filter_type = 1; 
    optional PaymentType filter_payment_type = 2;
}

message GetProductsResponse {
    repeated ProductMessage products = 1;
}

message PurchaseWithCoinsRequest {
    string user_id = 1;
    string product_id = 2;
}

message PurchaseWithCoinsResponse {
    bool success = 1;
    string message = 2;
    int64 remaining_coins = 3;
}

message InitiatePaymentRequest {
    string user_id = 1;
    string product_id = 2;
    GatewayType gateway = 3; 
}

message InitiatePaymentResponse {
    bool success = 1;
    string transaction_id = 2;
    string payment_url_or_token = 3; 
    string message = 4;
}

message GetPlayerProfileRequest {
  string game_id = 1;
  string player_id = 2;
  string target_player_id = 3;
}

message GetPlayerProfileResponse {
  bool success = 1;
  string player_id = 2;
  string name = 3;
  string avatar = 4;
  string border = 5;
  int32 level = 6;
  int64 coins = 7;
  bool is_vip = 8;
  int32 won_hands = 9;
  int32 lost_hands = 10;
}

message VerifyStorePurchaseRequest {
    string user_id = 1;
    string product_id = 2;
    string purchase_token = 3;
    GatewayType gateway = 4;
}

message VerifyStorePurchaseResponse {
    bool success = 1;
    string message = 2;
}
message GetTableConfigsRequest {
}

message TableConfigMessage {
    TableKind kind = 1;
    int32 entry_fee = 2;
    int32 prize = 3;
    int32 rounds = 4;
    int32 win_xp = 5;
    int32 loss_xp = 6;
}

message GetTableConfigsResponse {
    repeated TableConfigMessage configs = 1;
}
enum LeaderboardType {
    LEADERBOARD_INVALID = 0;
    LEADERBOARD_WEEKLY = 1;
    LEADERBOARD_MONTHLY = 2;
    LEADERBOARD_WINRATE = 3;
}

message GetLeaderboardRequest {
    string user_id = 1;
    LeaderboardType type = 2;
}

message LeaderboardEntry {
    int32 rank = 1;
    string user_id = 2;
    string name = 3;
    int32 avatar_ref = 4;
    string border_asset_key = 5;
    int32 level = 6;
}

message GetLeaderboardResponse {
    repeated LeaderboardEntry entries = 1;
    int32 my_rank = 2;
    bool my_rank_in_top = 3;
}