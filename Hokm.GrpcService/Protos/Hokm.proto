syntax = "proto3";
package hokm;

service HokmGameService {
	rpc StartGame (StartGameRequest) returns (StartGameResponse);
	rpc FormTeams (FormTeamsRequest) returns (FormTeamsResponse);
	rpc DealCards (DealCardsRequest) returns (DealCardsResponse);
	rpc PickTrump (PickTrumpRequest) returns (PickTrumpResponse);
	rpc PlayCard (PlayCardRequest) returns (PlayCardResponse);
	rpc GetGameState (GetGameStateRequest) returns (GameState);
    rpc GetSnapshot (GetSnapshotRequest) returns (GameSnapshotResponse);

	rpc StreamGame (StreamRequest) returns (stream GameEvent);
}

service UserService {
    rpc RegisterUser (RegisterUserRequest) returns (RegisterUserResponse);
    rpc RequestCode (RequestCodeRequest) returns (RequestCodeResponse);
    rpc VerifyCode (VerifyCodeRequest) returns (VerifyCodeResponse);
    //rpc GetProfile (GetProfileRequest) returns (ProfileResponse);
    rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileResponse);
}

message RegisterUserRequest {
    string full_name = 1;
    string user_name = 2;
    string email = 3;
    string phone_number = 4;
}
message RegisterUserResponse {
    bool success = 1;
    string token = 2;
}

message RequestCodeRequest {
    string phone_number = 1;
}

message RequestCodeResponse {
    bool success = 1;
    string message = 2;
    int32 expire_seconds = 3;
}

message VerifyCodeRequest {
    string phone_number = 1;
    string code = 2;
}

message VerifyCodeResponse {
    bool success = 1;
    bool is_new_user = 2;
}

message UpdateProfileRequest {
    string full_name = 1;
    string user_name = 2;
    int32 avatar_ref = 3;    
}

message UpdateProfileResponse {
    bool status = 1;
}

message UpdateUserStatsRequest {
    string user_id = 1;
    int32 score = 2;
    bool is_win = 3;
    TableKind table_kind = 4;
    int32 coin = 5;
    int32 kot = 6;
    int32 hakem_kot = 7;
    int32 round_won = 8;
    int32 round_lost = 9;

}

message StartGameRequest {
  string player1_id = 1;
  string player1_name = 2;
  string player1_side = 3;
  string player2_id = 4;
  string player2_name = 5;
  string player2_side = 6;
  string player3_id = 7;
  string player3_name = 8;
  string player3_side = 9;
  string player4_id = 10;
  string player4_name = 11;
  string player4_side = 12;
}

message StartGameResponse {
  string game_id = 1;
}

message FormTeamsRequest {
  string game_id = 1;
}

message FormTeamsResponse {
  string game_id = 1;
}

message DealCardsRequest {
  string game_id = 1;
  string dealer_id = 2;
}

message DealCardsResponse {
  bool success = 1;
}

message PickTrumpRequest {
  string game_id = 1;
  string trump_suit = 2;
  string dealer_id = 3;
}

message PickTrumpResponse {
  bool success = 1;
}

message PlayCardRequest {
  string game_id = 1;
  string player_id = 2;
  string suit = 3;
  string rank = 4;
}

message PlayCardResponse {
  bool success = 1;
}

message GetGameStateRequest {
  string game_id = 1;
}

message GetSnapshotRequest {
  string game_id = 1;
  string player_id = 2;
}

message GameSnapshotResponse {
  string payload = 1;
}

message GameState {
  string game_id = 1;
  string status = 2;
  int32 current_round = 3;
}

message StreamRequest {
  string game_id = 1;
  string player_id = 2;
}

message GameEvent {
  string event_type = 1;
  string payload = 2;
}

enum TableKind {
    SPEEDY = 0;
    ADVANCED = 1;
    PRO = 2;
    VIP = 3;
    CUSTOM = 4;
}